<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" role="img" aria-label="SoulHustleAI horizontal lockup">
  <title>SoulHustleAI — Horizontal Lockup</title>
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#F7DB7A"/>
      <stop offset="40%" stop-color="#F2C95C"/>
      <stop offset="75%" stop-color="#C9A033"/>
      <stop offset="100%" stop-color="#8A6A1E"/>
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F5F5"/>
      <stop offset="100%" stop-color="#7A7A7A"/>
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F7DB7A"/>
      <stop offset="60%" stop-color="#C9A033" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="400" fill="#050505"/>

  <!-- ICON on the left (centered in 400x400 bounds) -->
  <g transform="translate(40 40) scale(0.625)">
    <circle cx="256" cy="256" r="220" fill="url(#core)" opacity="0.3"/>
    <!-- Gold soul arc -->
    <path d="M 120 140 Q 60 250 130 340 T 280 420 Q 340 450 350 256 Q 360 110 430 90"
          fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round"/>
    <!-- Silver hustle arc -->
    <path d="M 430 90 Q 360 110 350 256 Q 340 450 280 420 Q 180 400 130 480"
          fill="none" stroke="url(#silver)" stroke-width="18" stroke-linecap="round"/>
    <!-- Compass core -->
    <g transform="translate(256 256)">
      <circle r="84" fill="none" stroke="url(#gold)" stroke-width="3"/>
      <circle r="60" fill="#080808" stroke="url(#gold)" stroke-width="2"/>
      <g stroke="#C9A033" stroke-width="2" stroke-linecap="round">
        <line x1="0" y1="-90" x2="0" y2="-76"/>
        <line x1="0" y1="-90" x2="0" y2="-76" transform="rotate(45)"/>
        <line x1="0" y1="-90" x2="0" y2="-76" transform="rotate(90)"/>
        <line x1="0" y1="-90" x2="0" y2="-76" transform="rotate(135)"/>
        <line x1="0" y1="-90" x2="0" y2="-76" transform="rotate(180)"/>
        <line x1="0" y1="-90" x2="0" y2="-76" transform="rotate(225)"/>
        <line x1="0" y1="-90" x2="0" y2="-76" transform="rotate(270)"/>
        <line x1="0" y1="-90" x2="0" y2="-76" transform="rotate(315)"/>
      </g>
      <path d="M 0 -50 L 10 0 L 0 50 L -10 0 Z" fill="url(#gold)"/>
      <path d="M -50 0 L 0 10 L 50 0 L 0 -10 Z" fill="url(#gold)"/>
      <circle r="6" fill="#F7DB7A"/>
    </g>
  </g>

  <!-- Divider -->
  <line x1="360" y1="120" x2="360" y2="280" stroke="url(#gold)" stroke-width="1.5" opacity="0.45"/>

  <!-- WORDMARK + subtitle + tagline -->
  <text x="400" y="200"
        font-family="'Cinzel', Georgia, serif"
        font-size="96"
        font-weight="600"
        letter-spacing="2">
    <tspan fill="#F2C95C">Soul</tspan><tspan fill="#E0E0E0">Hustle</tspan><tspan fill="url(#teal)">AI</tspan>
  </text>
  <text x="402" y="244"
        font-family="'Cinzel', Georgia, serif"
        font-size="22"
        font-weight="400"
        letter-spacing="18"
        fill="#8a8577">AUTOMATION  AGENCY</text>
  <line x1="400" y1="270" x2="720" y2="270" stroke="url(#gold)" stroke-width="1.2" opacity="0.6"/>
  <text x="400" y="300"
        font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="16"
        letter-spacing="6"
        fill="#C9A033"
        fill-opacity="0.75">MY  STAFF  DON'T  EXIST.</text>
</svg>
