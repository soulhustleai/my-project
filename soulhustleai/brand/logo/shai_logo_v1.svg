<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" width="600" height="200">
  <defs>
    <linearGradient id="gGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A832"/>
      <stop offset="50%" stop-color="#C9A033"/>
      <stop offset="100%" stop-color="#A87E28"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="200" fill="#0A0A0A" rx="8"/>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="4" height="200" fill="url(#gGold)" rx="2"/>

  <!-- Zero mark — the icon -->
  <!-- Outer circle -->
  <circle cx="108" cy="100" r="64" fill="none" stroke="url(#gGold)" stroke-width="2.5"/>
  <!-- Inner circle ring -->
  <circle cx="108" cy="100" r="54" fill="none" stroke="#C9A033" stroke-width="0.75" stroke-opacity="0.35"/>
  <!-- Z slash — the soul of the mark -->
  <path d="M76 70 L140 70 L76 130 L140 130" 
        fill="none" 
        stroke="url(#gGold)" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  <!-- Corner notch detail -->
  <line x1="97" y1="70" x2="97" y2="62" stroke="#C9A033" stroke-width="1.5" stroke-opacity="0.5"/>
  <line x1="119" y1="130" x2="119" y2="138" stroke="#C9A033" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Wordmark group -->
  <!-- SOUL HUSTLE -->
  <text x="195" y="88"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="38"
        font-weight="700"
        letter-spacing="6"
        fill="#FFFFFF">SOUL</text>
  <text x="195" y="133"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="38"
        font-weight="700"
        letter-spacing="1.5"
        fill="#FFFFFF">HUSTLE</text>

  <!-- A.I. — in gold, distinct weight -->
  <text x="482" y="133"
        font-family="'Courier New', Courier, monospace"
        font-size="34"
        font-weight="400"
        letter-spacing="2"
        fill="#C9A033">A.I.</text>

  <!-- Divider line between HUSTLE and A.I. -->
  <line x1="475" y1="108" x2="475" y2="138" stroke="#C9A033" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Tagline -->
  <text x="195" y="162"
        font-family="'Courier New', Courier, monospace"
        font-size="10.5"
        font-weight="400"
        letter-spacing="5"
        fill="#C9A033"
        fill-opacity="0.7">ZERO · C.E.O. · GODFIDENT COLLECTIVE</text>

  <!-- Top-right corner mark -->
  <text x="565" y="26"
        font-family="'Courier New', Courier, monospace"
        font-size="8"
        letter-spacing="2"
        fill="#C9A033"
        fill-opacity="0.4"
        text-anchor="end">™</text>
</svg>
