<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-label="SoulHustleAI — Infinite S v3 master">
  <title>SoulHustleAI — Infinite S (v3 master)</title>
  <desc>Dual arcs — gold soul + silver hustle — curving around a central gold compass. Soul meets hustle, tech makes it infinite.</desc>

  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#F7DB7A"/>
      <stop offset="40%" stop-color="#F2C95C"/>
      <stop offset="75%" stop-color="#C9A033"/>
      <stop offset="100%" stop-color="#8A6A1E"/>
    </linearGradient>

    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#F5F5F5"/>
      <stop offset="50%" stop-color="#BDBDBD"/>
      <stop offset="100%" stop-color="#5A5A5A"/>
    </linearGradient>

    <linearGradient id="teal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>

    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#F7DB7A" stop-opacity="1"/>
      <stop offset="30%" stop-color="#F2C95C" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#8A6A1E" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="bgHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#1a1405" stop-opacity="1"/>
      <stop offset="60%" stop-color="#0a0a0a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="1"/>
    </radialGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <filter id="bigGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ═══════════════════════════════════════════
       BACKGROUND — pure luxury black with gold halo
       ═══════════════════════════════════════════ -->
  <rect width="1200" height="1200" fill="#050505"/>
  <circle cx="600" cy="520" r="560" fill="url(#bgHalo)"/>

  <!-- Outer astrolabe ring (subtle technical grid) -->
  <g transform="translate(600 520)" opacity="0.18" fill="none" stroke="#C9A033">
    <circle r="500" stroke-width="1"/>
    <circle r="440" stroke-width="0.5"/>
    <circle r="380" stroke-width="0.5"/>
  </g>

  <!-- 12 outer tick marks -->
  <g transform="translate(600 520)" stroke="#C9A033" stroke-width="1.5" opacity="0.35">
    <line x1="0" y1="-510" x2="0" y2="-485"/>
    <line x1="0" y1="-510" x2="0" y2="-485" transform="rotate(30)"/>
    <line x1="0" y1="-510" x2="0" y2="-485" transform="rotate(60)"/>
    <line x1="0" y1="-510" x2="0" y2="-485" transform="rotate(90)"/>
    <line x1="0" y1="-510" x2="0" y2="-485" transform="rotate(120)"/>
    <line x1="0" y1="-510" x2="0" y2="-485" transform="rotate(150)"/>
    <line x1="0" y1="-510" x2="0" y2="-485" transform="rotate(180)"/>
    <line x1="0" y1="-510" x2="0" y2="-485" transform="rotate(210)"/>
    <line x1="0" y1="-510" x2="0" y2="-485" transform="rotate(240)"/>
    <line x1="0" y1="-510" x2="0" y2="-485" transform="rotate(270)"/>
    <line x1="0" y1="-510" x2="0" y2="-485" transform="rotate(300)"/>
    <line x1="0" y1="-510" x2="0" y2="-485" transform="rotate(330)"/>
  </g>

  <!-- ═══════════════════════════════════════════
       THE INFINITE S — two clean bezier arcs
       Gold arc sweeps left-side of the compass (SOUL)
       Silver arc sweeps right-side of the compass (HUSTLE)
       Together they form an S through the center
       ═══════════════════════════════════════════ -->

  <!-- GOLD SOUL ARC — top-left entrance, sweeps down the left side,
       passes behind the compass, exits bottom-right with arrow -->
  <path d="M 340 180
           C 140 280, 140 560, 380 640
           C 520 686, 640 640, 700 520
           C 760 400, 880 360, 1020 420"
        fill="none"
        stroke="url(#gold)"
        stroke-width="32"
        stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- SILVER HUSTLE ARC — bottom-right entrance, sweeps up the right side,
       passes behind the compass, exits top-left with arrow -->
  <path d="M 1020 420
           C 880 360, 760 400, 700 520
           C 640 640, 520 686, 380 640
           C 200 580, 180 820, 340 920"
        fill="none"
        stroke="url(#silver)"
        stroke-width="26"
        stroke-linecap="round"
        opacity="0.92"/>

  <!-- Gold arrow at SOUL start (top-left end) -->
  <g transform="translate(340 180) rotate(-115)">
    <circle r="14" fill="none" stroke="url(#gold)" stroke-width="5"/>
    <circle r="5" fill="#F7DB7A"/>
  </g>

  <!-- Silver arrow at HUSTLE end (bottom-left) -->
  <g transform="translate(340 920) rotate(65)">
    <circle r="12" fill="none" stroke="url(#silver)" stroke-width="5"/>
    <circle r="4" fill="#F5F5F5"/>
    <path d="M 18 0 L 4 -10 L 4 10 Z" fill="url(#silver)"/>
  </g>

  <!-- Gold arrow at SOUL end (right side) -->
  <g transform="translate(1020 420) rotate(-20)">
    <path d="M 18 0 L 4 -10 L 4 10 Z" fill="url(#gold)"/>
  </g>

  <!-- SOUL label (top-left, next to gold arc start) -->
  <text x="400" y="150"
        font-family="'Cinzel', Georgia, serif"
        font-size="40"
        font-weight="600"
        letter-spacing="14"
        fill="#F2C95C">SOUL</text>
  <line x1="400" y1="165" x2="560" y2="165" stroke="url(#gold)" stroke-width="2" opacity="0.8"/>

  <!-- HUSTLE label (bottom-right) -->
  <text x="780" y="970"
        font-family="'Cinzel', Georgia, serif"
        font-size="40"
        font-weight="600"
        letter-spacing="12"
        fill="#E0E0E0">HUSTLE</text>
  <line x1="560" y1="955" x2="780" y2="955" stroke="url(#silver)" stroke-width="2" opacity="0.7"/>

  <!-- ═══════════════════════════════════════════
       THE COMPASS CORE — big, central, unforgettable
       ═══════════════════════════════════════════ -->
  <g transform="translate(600 520)">
    <!-- Glow halo -->
    <circle r="200" fill="url(#coreGlow)"/>

    <!-- Outer ring -->
    <circle r="140" fill="none" stroke="url(#gold)" stroke-width="4"/>
    <circle r="132" fill="none" stroke="#F2C95C" stroke-width="1" opacity="0.5"/>

    <!-- 24 tick marks (premium astrolabe detail) -->
    <g stroke="#C9A033" stroke-width="2.5" stroke-linecap="round">
      <line x1="0" y1="-148" x2="0" y2="-128"/>
      <line x1="0" y1="-148" x2="0" y2="-128" transform="rotate(15)"/>
      <line x1="0" y1="-148" x2="0" y2="-128" transform="rotate(30)"/>
      <line x1="0" y1="-148" x2="0" y2="-128" transform="rotate(45)"/>
      <line x1="0" y1="-148" x2="0" y2="-128" transform="rotate(60)"/>
      <line x1="0" y1="-148" x2="0" y2="-128" transform="rotate(75)"/>
      <line x1="0" y1="-148" x2="0" y2="-128" transform="rotate(90)"/>
      <line x1="0" y1="-148" x2="0" y2="-128" transform="rotate(105)"/>
      <line x1="0" y1="-148" x2="0" y2="-128" transform="rotate(120)"/>
      <line x1="0" y1="-148" x2="0" y2="-128" transform="rotate(135)"/>
      <line x1="0" y1="-148" x2="0" y2="-128" transform="rotate(150)"/>
      <line x1="0" y1="-148" x2="0" y2="-128" transform="rotate(165)"/>
      <line x1="0" y1="-148" x2="0" y2="-128" transform="rotate(180)"/>
      <line x1="0" y1="-148" x2="0" y2="-128" transform="rotate(195)"/>
      <line x1="0" y1="-148" x2="0" y2="-128" transform="rotate(210)"/>
      <line x1="0" y1="-148" x2="0" y2="-128" transform="rotate(225)"/>
      <line x1="0" y1="-148" x2="0" y2="-128" transform="rotate(240)"/>
      <line x1="0" y1="-148" x2="0" y2="-128" transform="rotate(255)"/>
      <line x1="0" y1="-148" x2="0" y2="-128" transform="rotate(270)"/>
      <line x1="0" y1="-148" x2="0" y2="-128" transform="rotate(285)"/>
      <line x1="0" y1="-148" x2="0" y2="-128" transform="rotate(300)"/>
      <line x1="0" y1="-148" x2="0" y2="-128" transform="rotate(315)"/>
      <line x1="0" y1="-148" x2="0" y2="-128" transform="rotate(330)"/>
      <line x1="0" y1="-148" x2="0" y2="-128" transform="rotate(345)"/>
    </g>

    <!-- Inner compass face -->
    <circle r="100" fill="#070707" stroke="url(#gold)" stroke-width="3"/>
    <circle r="94" fill="none" stroke="#C9A033" stroke-width="0.8" opacity="0.4"/>

    <!-- 4-point gold star (the soul node / AI heart) -->
    <g filter="url(#bigGlow)">
      <path d="M 0 -84 L 16 0 L 0 84 L -16 0 Z" fill="url(#gold)"/>
      <path d="M -84 0 L 0 16 L 84 0 L 0 -16 Z" fill="url(#gold)"/>
      <!-- Short diagonal accent points -->
      <path d="M -48 -48 L 6 -6 L 48 48 L -6 6 Z" fill="url(#gold)" opacity="0.45"/>
      <path d="M 48 -48 L 6 6 L -48 48 L -6 -6 Z" fill="url(#gold)" opacity="0.45"/>
      <!-- Core -->
      <circle r="12" fill="#F7DB7A"/>
      <circle r="5" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════
       WORDMARK — SoulHustle[AI] using the
       same pattern as horizontal_lockup (which works)
       ═══════════════════════════════════════════ -->
  <!-- Decorative diamond -->
  <path d="M 595 1020 L 600 1012 L 605 1020 L 600 1028 Z" fill="#C9A033"/>

  <!-- Main wordmark — single text element, auto-flowing tspans.
       This is the pattern that works in horizontal_lockup. -->
  <text x="340" y="1100"
        font-family="'Cinzel', Georgia, serif"
        font-size="72"
        font-weight="700"
        letter-spacing="2">
    <tspan fill="#F2C95C">Soul</tspan><tspan fill="#E8E8E8">Hustle</tspan><tspan fill="url(#teal)">AI</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="1140"
        font-family="'Cinzel', Georgia, serif"
        font-size="20"
        font-weight="400"
        letter-spacing="16"
        text-anchor="middle"
        fill="#8a8577">AUTOMATION  AGENCY</text>

  <!-- Divider -->
  <line x1="420" y1="1160" x2="780" y2="1160" stroke="url(#gold)" stroke-width="1.4" opacity="0.6"/>

  <!-- Tagline -->
  <text x="600" y="1188"
        font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="14"
        font-weight="500"
        letter-spacing="7"
        text-anchor="middle"
        fill="#C9A033"
        fill-opacity="0.75">MY  STAFF  DON'T  EXIST.</text>

  <!-- Corner registration marks (cinematic detail) -->
  <g stroke="#C9A033" stroke-width="1" opacity="0.25" stroke-linecap="round">
    <line x1="40" y1="40" x2="75" y2="40"/>
    <line x1="40" y1="40" x2="40" y2="75"/>
    <line x1="1160" y1="40" x2="1125" y2="40"/>
    <line x1="1160" y1="40" x2="1160" y2="75"/>
  </g>
  <text x="1160" y="90"
        font-family="'JetBrains Mono', monospace"
        font-size="12"
        letter-spacing="2"
        text-anchor="end"
        fill="#C9A033"
        fill-opacity="0.4">™</text>
</svg>
