<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" width="1200" height="1200" role="img" aria-label="SoulHustleAI — Infinite S logo v3">
  <title>SoulHustleAI — Infinite S (v3)</title>
  <desc>Dual arcs (gold soul, silver hustle) forming an infinite S through a central compass emblem. The soul meets hustle to create something infinite on both ends.</desc>

  <defs>
    <!-- Gold gradient: warm rich gold with highlight + shadow -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#F7DB7A"/>
      <stop offset="35%" stop-color="#F2C95C"/>
      <stop offset="65%" stop-color="#C9A033"/>
      <stop offset="100%" stop-color="#8A6A1E"/>
    </linearGradient>

    <!-- Silver gradient: cool luminous silver -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#F5F5F5"/>
      <stop offset="50%" stop-color="#BDBDBD"/>
      <stop offset="100%" stop-color="#5A5A5A"/>
    </linearGradient>

    <!-- Teal accent (SHAI brand secondary #14B8A6) -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0F766E"/>
    </linearGradient>

    <!-- Radial glow for compass center -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#F7DB7A" stop-opacity="1"/>
      <stop offset="40%" stop-color="#C9A033" stop-opacity="0.85"/>
      <stop offset="80%" stop-color="#8A6A1E" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>

    <!-- Outer compass halo -->
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#F2C95C" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#C9A033" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop shadow filter for premium pop -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feOffset in="b" dx="0" dy="2" result="o"/>
      <feMerge>
        <feMergeNode in="o"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ═══════════════════════════════════════════
       BACKGROUND — pure luxury black
       ═══════════════════════════════════════════ -->
  <rect width="1200" height="1200" fill="#050505"/>

  <!-- Subtle gold radial glow behind center -->
  <circle cx="600" cy="540" r="520" fill="url(#halo)"/>

  <!-- ═══════════════════════════════════════════
       ASTROLABE RING — technical grid behind compass
       Signals the "tech" side: precision, calibration
       ═══════════════════════════════════════════ -->
  <g transform="translate(600 540)" opacity="0.22">
    <circle r="420" fill="none" stroke="#C9A033" stroke-width="1"/>
    <circle r="360" fill="none" stroke="#C9A033" stroke-width="0.6"/>
    <circle r="300" fill="none" stroke="#C9A033" stroke-width="0.4"/>
    <!-- 12 compass tick marks -->
    <g stroke="#C9A033" stroke-width="1.2">
      <line x1="0" y1="-420" x2="0" y2="-400"/>
      <line x1="210" y1="-363.7" x2="200" y2="-346.4" transform="rotate(30)"/>
      <line x1="0" y1="-420" x2="0" y2="-400" transform="rotate(30)"/>
      <line x1="0" y1="-420" x2="0" y2="-400" transform="rotate(60)"/>
      <line x1="0" y1="-420" x2="0" y2="-400" transform="rotate(90)"/>
      <line x1="0" y1="-420" x2="0" y2="-400" transform="rotate(120)"/>
      <line x1="0" y1="-420" x2="0" y2="-400" transform="rotate(150)"/>
      <line x1="0" y1="-420" x2="0" y2="-400" transform="rotate(180)"/>
      <line x1="0" y1="-420" x2="0" y2="-400" transform="rotate(210)"/>
      <line x1="0" y1="-420" x2="0" y2="-400" transform="rotate(240)"/>
      <line x1="0" y1="-420" x2="0" y2="-400" transform="rotate(270)"/>
      <line x1="0" y1="-420" x2="0" y2="-400" transform="rotate(300)"/>
      <line x1="0" y1="-420" x2="0" y2="-400" transform="rotate(330)"/>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════
       INFINITE S ARCS — the soul-meets-hustle story
       Gold arc = SOUL (left half)
       Silver arc = HUSTLE (right half)
       They weave through the compass creating infinity
       ═══════════════════════════════════════════ -->

  <!-- SOUL arc (gold) — top-left curving down through compass, exits bottom-left with arrow -->
  <path d="M 240 260
           Q 150 420  260 560
           T 520 720
           Q 600 770 620 540
           Q 640 320  780 220
           Q 900 150 1000 200"
        fill="none"
        stroke="url(#goldGrad)"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- HUSTLE arc (silver) — mirrored path to form the second half of S -->
  <path d="M 1000 200
           Q 900 150 780 220
           Q 640 320  620 540
           Q 600 770 520 720
           Q 400 660  280 780
           Q 200 860  250 940"
        fill="none"
        stroke="url(#silverGrad)"
        stroke-width="20"
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.95"/>

  <!-- Gold arrow head at SOUL end -->
  <g transform="translate(250 950) rotate(35)">
    <path d="M 0 0 L -22 -10 L -14 0 L -22 10 Z" fill="url(#goldGrad)" stroke="#F7DB7A" stroke-width="1.5"/>
    <circle cx="-2" cy="0" r="6" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
  </g>

  <!-- Silver arrow head at HUSTLE start (top right) -->
  <g transform="translate(1000 200) rotate(-25)">
    <path d="M 0 0 L 22 -10 L 14 0 L 22 10 Z" fill="url(#silverGrad)" stroke="#FFFFFF" stroke-width="1.5"/>
    <circle cx="2" cy="0" r="6" fill="none" stroke="url(#silverGrad)" stroke-width="3"/>
  </g>

  <!-- SOUL label (top-left) -->
  <text x="230" y="220"
        font-family="'Cinzel', Georgia, serif"
        font-size="32"
        font-weight="600"
        letter-spacing="12"
        fill="#F2C95C"
        fill-opacity="0.85">SOUL</text>
  <line x1="230" y1="232" x2="340" y2="232" stroke="#C9A033" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- HUSTLE label (bottom-right) -->
  <text x="790" y="820"
        font-family="'Cinzel', Georgia, serif"
        font-size="32"
        font-weight="600"
        letter-spacing="10"
        fill="#E0E0E0"
        fill-opacity="0.85">HUSTLE</text>
  <line x1="790" y1="832" x2="960" y2="832" stroke="#BDBDBD" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- ═══════════════════════════════════════════
       THE COMPASS CORE — central emblem
       Gold ring, 4-point star, tick marks, glow
       ═══════════════════════════════════════════ -->
  <g transform="translate(600 540)" filter="url(#softShadow)">
    <!-- Outer halo disc -->
    <circle r="150" fill="url(#coreGlow)"/>

    <!-- Outer compass ring -->
    <circle r="115" fill="none" stroke="url(#goldGrad)" stroke-width="3.5"/>
    <circle r="108" fill="none" stroke="#F2C95C" stroke-width="0.8" opacity="0.5"/>

    <!-- 24 tick marks around the compass (premium astrolabe detail) -->
    <g stroke="#C9A033" stroke-width="2" stroke-linecap="round">
      <line x1="0" y1="-120" x2="0" y2="-104"/>
      <line x1="0" y1="-120" x2="0" y2="-104" transform="rotate(15)"/>
      <line x1="0" y1="-120" x2="0" y2="-104" transform="rotate(30)"/>
      <line x1="0" y1="-120" x2="0" y2="-104" transform="rotate(45)"/>
      <line x1="0" y1="-120" x2="0" y2="-104" transform="rotate(60)"/>
      <line x1="0" y1="-120" x2="0" y2="-104" transform="rotate(75)"/>
      <line x1="0" y1="-120" x2="0" y2="-104" transform="rotate(90)"/>
      <line x1="0" y1="-120" x2="0" y2="-104" transform="rotate(105)"/>
      <line x1="0" y1="-120" x2="0" y2="-104" transform="rotate(120)"/>
      <line x1="0" y1="-120" x2="0" y2="-104" transform="rotate(135)"/>
      <line x1="0" y1="-120" x2="0" y2="-104" transform="rotate(150)"/>
      <line x1="0" y1="-120" x2="0" y2="-104" transform="rotate(165)"/>
      <line x1="0" y1="-120" x2="0" y2="-104" transform="rotate(180)"/>
      <line x1="0" y1="-120" x2="0" y2="-104" transform="rotate(195)"/>
      <line x1="0" y1="-120" x2="0" y2="-104" transform="rotate(210)"/>
      <line x1="0" y1="-120" x2="0" y2="-104" transform="rotate(225)"/>
      <line x1="0" y1="-120" x2="0" y2="-104" transform="rotate(240)"/>
      <line x1="0" y1="-120" x2="0" y2="-104" transform="rotate(255)"/>
      <line x1="0" y1="-120" x2="0" y2="-104" transform="rotate(270)"/>
      <line x1="0" y1="-120" x2="0" y2="-104" transform="rotate(285)"/>
      <line x1="0" y1="-120" x2="0" y2="-104" transform="rotate(300)"/>
      <line x1="0" y1="-120" x2="0" y2="-104" transform="rotate(315)"/>
      <line x1="0" y1="-120" x2="0" y2="-104" transform="rotate(330)"/>
      <line x1="0" y1="-120" x2="0" y2="-104" transform="rotate(345)"/>
    </g>

    <!-- Inner dark disc (navigation face) -->
    <circle r="88" fill="#080808" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <circle r="82" fill="none" stroke="#C9A033" stroke-width="0.6" opacity="0.4"/>

    <!-- ✦ 4-POINT STAR — The "soul node" at the heart of the mark -->
    <g filter="url(#glow)">
      <!-- Vertical diamond -->
      <path d="M 0 -72 L 14 0 L 0 72 L -14 0 Z" fill="url(#goldGrad)"/>
      <!-- Horizontal diamond -->
      <path d="M -72 0 L 0 14 L 72 0 L 0 -14 Z" fill="url(#goldGrad)"/>
      <!-- Short diagonals for a sparkle feel -->
      <path d="M -42 -42 L 6 -6 L 42 42 L -6 6 Z" fill="url(#goldGrad)" opacity="0.55"/>
      <path d="M 42 -42 L 6 6 L -42 42 L -6 -6 Z" fill="url(#goldGrad)" opacity="0.55"/>
      <!-- Center core -->
      <circle r="10" fill="#F7DB7A"/>
      <circle r="4" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- ═══════════════════════════════════════════
       WORDMARK — SoulHustleAI + AUTOMATION AGENCY
       ═══════════════════════════════════════════ -->
  <!-- Top divider dot -->
  <path d="M 595 928 L 600 920 L 605 928 L 600 936 Z" fill="#C9A033"/>

  <!-- SoulHustle[AI] main mark -->
  <text x="600" y="1010"
        font-family="'Cinzel', Georgia, serif"
        font-size="84"
        font-weight="600"
        letter-spacing="2"
        text-anchor="middle">
    <tspan fill="#F2C95C">Soul</tspan><tspan fill="#E0E0E0">Hustle</tspan><tspan fill="url(#tealGrad)">AI</tspan>
  </text>

  <!-- Subtitle -->
  <text x="600" y="1062"
        font-family="'Cinzel', Georgia, serif"
        font-size="18"
        font-weight="400"
        letter-spacing="14"
        text-anchor="middle"
        fill="#8a8577">AUTOMATION  AGENCY</text>

  <!-- Bottom accent line -->
  <line x1="420" y1="1092" x2="780" y2="1092" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.6"/>

  <!-- Tagline -->
  <text x="600" y="1122"
        font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="13"
        font-weight="500"
        letter-spacing="6"
        text-anchor="middle"
        fill="#C9A033"
        fill-opacity="0.7">MY  STAFF  DON'T  EXIST.</text>

  <!-- Top-right trademark -->
  <text x="1140" y="50"
        font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="11"
        letter-spacing="2"
        fill="#C9A033"
        fill-opacity="0.4"
        text-anchor="end">™</text>

  <!-- Corner registration marks (print-ready detail) -->
  <g stroke="#C9A033" stroke-width="1" opacity="0.3" stroke-linecap="round">
    <line x1="40" y1="40" x2="70" y2="40"/>
    <line x1="40" y1="40" x2="40" y2="70"/>
    <line x1="1160" y1="40" x2="1130" y2="40"/>
    <line x1="1160" y1="40" x2="1160" y2="70"/>
    <line x1="40" y1="1160" x2="70" y2="1160"/>
    <line x1="40" y1="1160" x2="40" y2="1130"/>
    <line x1="1160" y1="1160" x2="1130" y2="1160"/>
    <line x1="1160" y1="1160" x2="1160" y2="1130"/>
  </g>
</svg>
